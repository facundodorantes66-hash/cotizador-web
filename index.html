<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador de Desarrollo Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Sistema de Cotización Web</h1>
        
        <form id="cotizadorForm" class="card">
            <div class="form-group">
                <label for="cliente">Nombre del cliente:</label>
                <input type="text" id="cliente" required placeholder="Ej. Empresa ABC">
            </div>

            <div class="form-group">
                <label for="proyecto">Nombre del proyecto:</label>
                <input type="text" id="proyecto" required placeholder="Ej. Tienda en Línea">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="paginas">Cantidad de páginas:</label>
                    <input type="number" id="paginas" min="1" required placeholder="0">
                </div>

                <div class="form-group">
                    <label for="precioPagina">Precio por página ($):</label>
                    <input type="number" id="precioPagina" min="0" step="0.01" required placeholder="0.00">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="horas">Horas adicionales:</label>
                    <input type="number" id="horas" min="0" required placeholder="0">
                </div>

                <div class="form-group">
                    <label for="precioHora">Precio por hora ($):</label>
                    <input type="number" id="precioHora" min="0" step="0.01" required placeholder="0.00">
                </div>
            </div>

            <button type="submit" class="btn-submit">Generar Cotización</button>
        </form>

        <section id="resultadoCotizacion" class="card resultado-oculto"></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
